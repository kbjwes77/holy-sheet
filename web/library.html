<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="darkreader-lock" />
        <meta name="robots" content="noindex" />
        <title>GradeLake - My Library</title>
        <script>
            let theme = null;
            try {
                theme = localStorage.getItem("theme");
            } catch {}
            document.documentElement.dataset.bsTheme = theme === "light" || theme === "dark" ? theme : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        </script>
        <link rel="stylesheet" href="../public/css/bootstrap.min.css" />
        <link rel="stylesheet" href="../public/css/bootstrap-icons.min.css" />
        <link rel="stylesheet" href="./app.css" />
        <link rel="icon" href="../public/images/favicon.ico" sizes="48x48" />
        <link rel="icon" type="image/svg+xml" href="../public/images/logo-square.svg" />
        <link rel="icon" type="image/png" sizes="32x32" href="../public/images/favicon-32x32.png" />
        <link rel="icon" type="image/png" sizes="16x16" href="../public/images/favicon-16x16.png" />
        <link rel="apple-touch-icon" href="../public/images/apple-touch-icon.png" />
    </head>
    <body hidden>
        <nav id="nav"></nav>
        <main class="container py-7">
            <div class="page-header">
                <div class="page-header-icon"><i class="bi bi-collection"></i></div>
                <div class="page-header-text">
                    <h1 class="page-header-title">My Library</h1>
                    <p class="page-header-subtitle">Your study materials, organized into groups.</p>
                </div>
            </div>
            <div class="d-flex align-items-center justify-content-end gap-3 flex-wrap mb-5">
                <button type="button" class="btn-outline theme-secondary" id="btn-new-group"><i class="bi bi-folder-plus me-1"></i>New group</button>
                <button type="button" class="btn-solid theme-primary" id="btn-new-material"><i class="bi bi-plus-lg me-1"></i>New material</button>
            </div>
            <div class="alert theme-danger d-none" id="error" role="alert"></div>
            <div class="row g-5">
                <div class="lg:col-4">
                    <div class="card shadow-sm">
                        <div class="card-header fw-semibold">Groups</div>
                        <div class="list-group list-group-flush" id="group-tree"></div>
                    </div>
                </div>
                <div class="lg:col-8">
                    <div class="card shadow-sm">
                        <div class="card-header d-flex align-items-center gap-3 flex-wrap">
                            <span class="fw-semibold me-auto" id="group-title"></span>
                            <div class="btn-group btn-group-sm d-none" id="group-actions">
                                <button type="button" class="btn-outline theme-secondary" id="btn-rename-group"><i class="bi bi-pencil"></i> Rename</button>
                                <select class="form-select form-select-sm" id="group-status" aria-label="Group status"></select>
                                <button type="button" class="btn-outline theme-danger" id="btn-delete-group"><i class="bi bi-trash"></i> Delete</button>
                            </div>
                        </div>
                        <div class="card-body">
                            <div class="d-flex gap-3 flex-wrap mb-4">
                                <input class="form-control flex-fill" type="search" id="filter-q" placeholder="Search by name" aria-label="Search by name" />
                                <select class="form-select w-auto" id="filter-type" aria-label="Type"></select>
                                <input class="form-control w-auto" type="text" id="filter-tag" placeholder="Tag" aria-label="Tag" />
                            </div>
                            <div class="list-group" id="materials"></div>
                            <div class="small fg-secondary mt-3" id="count"></div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
        <script type="module" src="./library.ts"></script>
    </body>
</html>

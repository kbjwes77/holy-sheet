<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="darkreader-lock" />
        <meta name="robots" content="noindex" />
        <title>Grade Lake - Slide Deck</title>
        <script>
            let theme = null;
            try {
                theme = localStorage.getItem("theme");
            } catch {}
            document.documentElement.dataset.bsTheme = theme === "light" || theme === "dark" ? theme : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        </script>
        <link rel="stylesheet" href="../public/css/bootstrap.min.css" />
        <link rel="stylesheet" href="../public/css/bootstrap-icons.min.css" />
        <link rel="stylesheet" href="./app.css" />
        <link rel="icon" href="../public/images/favicon.ico" sizes="48x48" />
        <link rel="icon" type="image/svg+xml" href="../public/images/logo-square.svg" />
        <link rel="icon" type="image/png" sizes="32x32" href="../public/images/favicon-32x32.png" />
        <link rel="icon" type="image/png" sizes="16x16" href="../public/images/favicon-16x16.png" />
        <link rel="apple-touch-icon" href="../public/images/apple-touch-icon.png" />
    </head>
    <body hidden>
        <nav id="nav"></nav>
        <main class="container py-7">
            <div class="page-header">
                <div class="page-header-icon"><i class="bi bi-easel"></i></div>
                <div class="page-header-text">
                    <h1 class="page-header-title" id="deck-title">Slide deck</h1>
                    <p class="page-header-subtitle" id="deck-subtitle">A read-only presentation.</p>
                </div>
            </div>
            <div class="d-flex align-items-center justify-content-end gap-3 flex-wrap mb-5">
                <a class="btn-outline theme-secondary" href="/library"><i class="bi bi-arrow-left me-1"></i>Back to library</a>
                <a class="btn-solid theme-primary" id="deck-download" href="#" download><i class="bi bi-download me-1"></i>Download .pptx</a>
            </div>
            <div class="alert theme-danger d-none" id="error" role="alert"></div>
            <div id="viewer"></div>
        </main>
        <script type="module" src="./slides.ts"></script>
    </body>
</html>

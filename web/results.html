<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="darkreader-lock" />
        <meta name="robots" content="noindex" />
        <title>Grade Lake - Results</title>
        <script>
            let theme = null;
            try {
                theme = localStorage.getItem("theme");
            } catch {}
            document.documentElement.dataset.bsTheme = theme === "light" || theme === "dark" ? theme : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        </script>
        <link rel="stylesheet" href="../public/css/bootstrap.min.css" />
        <link rel="stylesheet" href="../public/css/bootstrap-icons.min.css" />
        <link rel="stylesheet" href="./app.css" />
        <link rel="icon" href="../public/images/favicon.ico" sizes="48x48" />
        <link rel="icon" type="image/svg+xml" href="../public/images/logo-square.svg" />
        <link rel="icon" type="image/png" sizes="32x32" href="../public/images/favicon-32x32.png" />
        <link rel="icon" type="image/png" sizes="16x16" href="../public/images/favicon-16x16.png" />
        <link rel="apple-touch-icon" href="../public/images/apple-touch-icon.png" />
    </head>
    <body hidden>
        <nav id="nav"></nav>
        <main class="container py-7">
            <div class="page-header">
                <div class="page-header-icon"><i class="bi bi-journal-check"></i></div>
                <div class="page-header-text">
                    <h1 class="page-header-title">Results</h1>
                    <p class="page-header-subtitle">Every grading run is saved here, with any curve you gave it. Open one to see its table and charts again, or download its CSV.</p>
                </div>
            </div>
            <div class="d-flex align-items-center justify-content-end gap-3 flex-wrap mb-5">
                <a class="btn-solid theme-primary" href="/grader"><i class="bi bi-clipboard-check me-1"></i>Grade Sheets</a>
            </div>
            <div class="alert theme-danger d-none" id="error" role="alert"></div>
            <div class="card shadow-sm">
                <div class="text-center fg-secondary py-7 d-none" id="runs-empty">
                    <i class="bi bi-journal-check fs-4xl d-block mb-5"></i>
                    <p class="mb-1 fw-semibold">No results yet</p>
                    <p class="small mb-0">Grade a set of sheets and the scores are saved here.</p>
                </div>
                <div class="table-responsive d-none" id="runs-wrap">
                    <table class="table table-hover table-sm align-middle mb-0 grades-table" id="runs-table">
                        <thead>
                            <tr>
                                <th scope="col">Name</th>
                                <th scope="col">Graded</th>
                                <th scope="col" class="text-end">Students</th>
                                <th scope="col" class="text-end">Average</th>
                                <th scope="col">Status</th>
                                <th scope="col" class="text-end"><span class="visually-hidden">Actions</span></th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
            <div class="d-flex align-items-center gap-3 mt-3">
                <span class="small fg-secondary me-auto" id="count"></span>
                <button type="button" class="btn-outline theme-secondary btn-sm d-none" id="btn-more">Show more</button>
            </div>
        </main>
        <script type="module" src="./results.ts"></script>
    </body>
</html>

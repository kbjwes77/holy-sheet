<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="darkreader-lock" />
        <meta name="robots" content="noindex" />
        <title>Grade Lake - Reset password</title>
        <script>
            let theme = null;
            try {
                theme = localStorage.getItem("theme");
            } catch {}
            document.documentElement.dataset.bsTheme = theme === "light" || theme === "dark" ? theme : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        </script>
        <link rel="stylesheet" href="../public/css/bootstrap.min.css" />
        <link rel="stylesheet" href="../public/css/bootstrap-icons.min.css" />
        <link rel="stylesheet" href="./app.css" />
        <link rel="icon" href="../public/images/favicon.ico" sizes="48x48" />
        <link rel="icon" type="image/svg+xml" href="../public/images/logo-square.svg" />
        <link rel="icon" type="image/png" sizes="32x32" href="../public/images/favicon-32x32.png" />
        <link rel="icon" type="image/png" sizes="16x16" href="../public/images/favicon-16x16.png" />
        <link rel="apple-touch-icon" href="../public/images/apple-touch-icon.png" />
    </head>
    <body>
        <main class="container py-7" style="max-width: 26rem">
            <h1 class="brand-title mb-5"><img src="../public/images/logo-square.svg" alt="" width="36" height="35" class="me-3" />Grade Lake</h1>
            <div class="card shadow-sm">
                <div class="card-body">
                    <h2 class="h5 mb-4">Reset password</h2>
                    <form id="form">
                        <p class="small fg-secondary mb-4">Enter your account's email and we'll send you a link to choose a new password.</p>
                        <div class="mb-5">
                            <label class="form-label" for="email">Email</label>
                            <input class="form-control" id="email" type="email" autocomplete="email" required />
                        </div>
                        <div class="alert theme-danger d-none" id="error" role="alert"></div>
                        <button class="btn-solid theme-primary w-100" type="submit" id="submit">Send reset link</button>
                    </form>
                    <div class="alert theme-success d-none mb-0" id="sent" role="status">If an account uses <strong id="sent-email"></strong>, a reset link is on its way. It works for one hour. Check your spam folder if it doesn't arrive in a few minutes.</div>
                </div>
            </div>
            <p class="small fg-secondary mt-4">Remembered it? <a href="/login">Sign in</a></p>
        </main>
        <script type="module" src="./forgot-password.ts"></script>
    </body>
</html>

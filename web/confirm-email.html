<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="darkreader-lock" />
        <meta name="robots" content="noindex" />
        <meta name="referrer" content="no-referrer" />
        <title>Grade Lake - Confirm your email</title>
        <script>
            let theme = null;
            try {
                theme = localStorage.getItem("theme");
            } catch {}
            document.documentElement.dataset.bsTheme = theme === "light" || theme === "dark" ? theme : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        </script>
        <link rel="stylesheet" href="../public/css/bootstrap.min.css" />
        <link rel="stylesheet" href="../public/css/bootstrap-icons.min.css" />
        <link rel="stylesheet" href="./app.css" />
        <link rel="icon" href="../public/images/favicon.ico" sizes="48x48" />
        <link rel="icon" type="image/svg+xml" href="../public/images/logo-square.svg" />
        <link rel="icon" type="image/png" sizes="32x32" href="../public/images/favicon-32x32.png" />
        <link rel="icon" type="image/png" sizes="16x16" href="../public/images/favicon-16x16.png" />
        <link rel="apple-touch-icon" href="../public/images/apple-touch-icon.png" />
    </head>
    <body>
        <main class="container py-7" style="max-width: 26rem">
            <h1 class="brand-title mb-5"><img src="../public/images/logo-square.svg" alt="" width="36" height="35" class="me-3" />Grade Lake</h1>
            <div class="card shadow-sm">
                <div class="card-body">
                    <h2 class="h5 mb-4">Confirm your new email address</h2>
                    <p class="small fg-secondary mb-5" id="intro">Use this address to sign in to Grade Lake from now on.</p>
                    <div class="alert theme-danger d-none" id="error" role="alert"></div>
                    <button class="btn-solid theme-primary w-100" type="button" id="submit">Confirm email address</button>
                    <div class="alert theme-success mb-0 d-none" id="done" role="status">
                        <i class="bi bi-check-circle"></i>
                        <div>Your account's email address is now <strong class="text-break" id="done-email"></strong>. <a href="/dashboard" class="alert-link">Go to your dashboard</a></div>
                    </div>
                </div>
            </div>
        </main>
        <script type="module" src="./confirm-email.ts"></script>
    </body>
</html>
